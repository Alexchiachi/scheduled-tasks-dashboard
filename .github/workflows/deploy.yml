name: Deploy Scheduled Tasks Dashboard to GitHub Pages

# 網站已由 GitHub Pages「從分支發布」（pages build and deployment）自動上線，
# 這支 workflow 再發布一次是重複的，兩者同時搶部署會偶發失敗並寄出失敗通知信。
# 因此只保留手動觸發；要改回自動發布，先到 Settings → Pages 把來源改成 GitHub Actions。
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
